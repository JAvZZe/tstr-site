name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd web/tstr-frontend
          npm install

      - name: Lint changed files (blocking)
        run: |
          cd web/tstr-frontend
          npm run lint

      - name: Security scan changed files (blocking)
        run: |
          cd web/tstr-frontend
          npm run verify

      - name: ShellCheck changed shell scripts (blocking)
        run: bash scripts/shellcheck-changed.sh

      - name: Build frontend
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PUBLIC_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd web/tstr-frontend
          npm run build

      # Deploy is handled by Cloudflare's native GitHub integration
      # (project tstr-hub watches main and builds web/tstr-frontend).
      # The cloudflare/pages-action step below was redundant and failed because
      # secrets.CF_API_TOKEN is not set; it is intentionally removed.
